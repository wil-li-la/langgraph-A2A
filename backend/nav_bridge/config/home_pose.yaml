# Home-pose auto-seed for AMCL.
#
# Where the Stretch sits in the map frame at driver-boot time. Read by
# `nav_service.py` at launch — if the robot's wheel odometry is at
# (0, 0, 0) ± `odom_epsilon` when this file is loaded (i.e. the
# `stretch3-zmq` driver just started fresh, so odom hasn't accumulated
# any motion), the contents below are published to AMCL's
# `/initialpose` topic.  AMCL then has a seed and starts publishing
# `map → odom` immediately — no operator drag required for the normal
# cold-start case.
#
# When `odom` is NOT near origin at launch (e.g. the driver was
# restarted mid-room, or someone teleop'd before nav came up), this
# auto-seed is SKIPPED and `nav_service` surfaces `localization:
# unseeded` to the dashboard.  Operator drag on /nav becomes the
# fallback, same as today.
#
# Frame note: x/y/theta are in the **map** frame defined by
# `backend/maps/305/raw/map.yaml` (origin [-6.0480, -4.6439, 0.0] m,
# 6 mm/px).  If the map ever gets re-baked with a different origin,
# these coordinates must be re-measured.

home_pose:
  frame_id: map

  # Usual parking spot in the map frame, measured 2026-05-21:
  # robot sits at (x=-4.0, y=-3.4) facing the +x axis (yaw=0).
  #
  # If the map gets re-baked with a different origin, OR the dock
  # itself moves, re-measure via either:
  #   - drag the robot marker on /nav until it lines up, copy the
  #     converged (x, y, θ) here, OR
  #   - tape-measure from the map origin ([-6.0480, -4.6439, 0.0] in
  #     map.yaml) to the dock.
  x:     -4.0    # meters, map frame
  y:     -3.4    # meters, map frame
  theta:  0.0    # radians, map frame (yaw; ROS convention: +x = 0, CCW +)

  # How close to (0, 0, 0) the robot's odom must be at launch for the
  # auto-seed to fire.  Default 5 cm + ~3°.  Loose enough to absorb the
  # small odom-reset jitter the stretch3-zmq driver sometimes leaves.
  odom_epsilon_xy:    0.05    # meters
  odom_epsilon_theta: 0.05    # radians (~3°)
