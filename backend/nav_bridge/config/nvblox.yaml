# nvblox node config — voxel size, ESDF/TSDF settings, depth integration.
# Loaded by the launch file once isaac_ros_nvblox is installed and
# wired into nav.launch.py (currently a stub).
#
# Reference defaults from isaac_ros_nvblox/nvblox_examples_bringup.

nvblox_node:
  ros__parameters:
    use_sim_time: false

    # World representation
    voxel_size: 0.05            # m — global TSDF voxel
    esdf_slice_height: 0.30     # m — height of 2D slice exported as costmap
                                # (above floor, below most obstacles)
    esdf_2d_min_height: 0.10
    esdf_2d_max_height: 1.50

    # Depth source
    depth_qos: "SENSOR_DATA"
    depth_camera_topic: "/camera/depth/image_rect_raw"
    depth_camera_info_topic: "/camera/depth/camera_info"
    color_camera_topic: "/camera/color/image_raw"
    color_camera_info_topic: "/camera/color/camera_info"

    # Frames
    map_frame: "map"
    global_frame: "map"
    pose_frame: "base_link"

    # Update rates (Hz)
    integrate_depth_rate_hz: 10.0
    integrate_color_rate_hz: 5.0
    update_esdf_rate_hz: 10.0
    publish_layer_rate_hz: 5.0

    # Output topics nvblox publishes (consumed by Nav2's local costmap layer)
    use_static_occupancy_layer: false
    publish_esdf_distance_slice: true
