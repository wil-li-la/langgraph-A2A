version: '3.8'

services:
  langgraph-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-a2a-agent
    ports:
      - "9999:9999"
    environment:
      # LLM Provider Configuration
      - model_source=${model_source:-google}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Optional: Custom OpenAI-compatible endpoint
      - TOOL_LLM_URL=${TOOL_LLM_URL}
      - TOOL_LLM_NAME=${TOOL_LLM_NAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/agent-card"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
