# Nav2 params for the lab nvblox stack. Starts from
# nav2_bringup/params/nav2_params.yaml; only fields tuned for this setup
# are listed here. Anything not specified inherits Nav2 defaults.
#
# Tuning notes:
#   - controller_frequency: 20 Hz matches the cmd_vel watchdog (200ms)
#     with comfortable margin. Going below 5 Hz risks watchdog stops.
#   - transform_tolerance: bumped to 0.5 s to absorb Wi-Fi jitter on
#     the odom_tf bridge.
#   - local_costmap.plugins: nvblox layer added once isaac_ros_nvblox is
#     installed and properly wired (currently commented out).

amcl:
  ros__parameters:
    use_sim_time: false

    # frames — match the existing TF tree from sensors_bridge.py + nav.launch.py
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "/scan"

    # particle filter
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    # differential-drive motion model (Stretch's base has two driven wheels + caster)
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # likelihood-field sensor model (faster than the beam model)
    laser_model_type: "likelihood_field"
    laser_min_range: 0.30
    laser_max_range: 8.00
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.20
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5

    # auto-seed covariance: ~0.5 m + ~15° std-dev — absorbs dock slop
    initial_cov_xx: 0.25
    initial_cov_yy: 0.25
    initial_cov_aa: 0.07

    # update rates
    update_min_d: 0.20
    update_min_a: 0.20
    transform_tolerance: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.5
    # default_nav_to_pose_bt_xml left UNSET so Nav2 falls back to its
    # built-in navigate_to_pose_w_replanning_and_recovery.xml shipped
    # with nav2_bt_navigator. Setting it to "" causes Empty Tree errors.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5            # Stretch comfortable cap
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.5
      # Phase 1c — nvblox is now built and producing
      # /nvblox_node/static_map_slice. The nvblox_layer plugin (from the
      # nvblox_nav2 package, libnvblox_nav2.so) integrates that into the
      # local costmap so DWB/MPPI sees live obstacles.
      plugins: ["nvblox_layer", "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        max_obstacle_distance: 1.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.006
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 3.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # set via launch

depthimage_to_laserscan:
  ros__parameters:
    # 10 rows of depth pixels around the depth image's centerline get
    # collapsed (min over rows) into a single laser line. With the D435if
    # rotated to the standard optical convention this is a horizontal
    # slice at the camera's optical-axis height (~1.4 m on the Stretch).
    scan_height: 10
    range_min: 0.30
    range_max: 8.0
    output_frame: "camera_depth_optical_frame"
